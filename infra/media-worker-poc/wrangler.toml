# TASK 032.5 controlled POC - STAGING ONLY. Owner-approved 2026-10-11; resource alignment (Option 1) approved 2026-10-12.
# Targets ONLY the owner-created resources:
#   Worker     innerdwes-media-poc    (workers.dev address only; no routes, no custom domains, no DNS)
#   R2 bucket  innerdwes-media-poc    (private: no r2.dev public URL, no custom domain)
# There are deliberately NO [env.*] sections: a single config means `wrangler deploy` can only ever target this one
# Worker name. The scripts additionally refuse to run with --env / a different name (scripts/guard.mjs).
# Secrets (never committed; set by scripts/provision.sh with `wrangler secret put`):
#   MEDIA_TOKEN_KEYS     JSON {"<kid>":"<base64url 32 bytes>"}  playback-token HMAC keys
#   MEDIA_ADMIN_KEY      base64url 32 bytes                     HMAC for the epoch (revocation) endpoint
name = "innerdwes-media-poc"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
vars = { ALLOWED_ORIGIN = "*", POC = "1", ACCT_MODE = "seg" }   # ACCT_MODE: "chunk" | "pipe" (delivered-byte accounting, src/index.ts)

r2_buckets = [ { binding = "BUCKET", bucket_name = "innerdwes-media-poc" } ]
kv_namespaces = [ { binding = "EPOCHS", id = "9755718a140b42d09506168cee66508f" } ]   # innerdwes-media-poc-epochs (set by provision.sh)
analytics_engine_datasets = [
  { binding = "BW", dataset = "innerdwes_media_poc_bw" },
  { binding = "LISTEN", dataset = "innerdwes_media_poc_listen" },
]

# Privacy: Workers Logs / traces OFF. Invocation logs carry request metadata (URL incl. the ?tk= token, headers,
# request.cf geo) - not needed for the POC and not allowed by the no-IP/no-UA rule. Measurement uses Analytics Engine
# data points that carry no IP, user agent or listener id (see src/index.ts).
[observability]
enabled = false

[[queues.producers]]
binding = "LISTEN_Q"
queue = "innerdwes-media-poc-listen"

[[queues.consumers]]
queue = "innerdwes-media-poc-listen"
max_batch_size = 100
max_batch_timeout = 30
